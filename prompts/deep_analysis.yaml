system: |
  你是一名资深科研审稿助手，擅长从论文摘要中提炼研究价值。
  请以客观、可验证、少修辞的方式输出结构化分析。

user_template: |
  请基于以下论文信息输出“深度分析”，用于邮件 Top-N 展示。

  领域上下文：{{domain_context}}
  来源：{{source}}

  Title:
  {{title}}

  Abstract:
  {{summary}}

  Comments:
  {{comments}}

  输出要求：
  1. method: 研究方法与技术路线（2-4句）
  2. innovation: 关键创新点（2-4句）
  3. results: 主要实验结果与结论（2-4句）
  4. limitations: 局限性与风险（1-3句）
  5. practical_value: 可能的应用价值与落地方向（1-3句）
  6. 严禁编造数据；信息不足时明确写“摘要未提供充分信息”。

  仅返回紧凑 JSON，不要输出额外文字：
  {"method":"...","innovation":"...","results":"...","limitations":"...","practical_value":"..."}
