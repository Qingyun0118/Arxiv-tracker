categories: ["cs.CV", "cs.LG", "cs.AI"]

# 可选：从环境变量注入分类（优先级：CLI > 环境变量 > 配置）
categories_env: "TRACKER_CATEGORIES"

keywords:
  - "open vocabulary"
  - "open-vocabulary"
  - "open vocabulary segmentation"
  - "open-vocabulary segmentation"
  - "vision language model"
  - "training-free"
  - "training free"

# 可选：严格布尔表达式（支持括号 + AND/OR），设置后优先于 keywords
# 例："(open vocabulary segmentation OR vision language grounding) AND (reinforcement learning OR MARL)"
keyword_expression: ""

# 可选：从环境变量注入关键词/表达式（优先级：CLI > 环境变量 > 配置）
keywords_env: "TRACKER_KEYWORDS"
keyword_expression_env: "TRACKER_KEYWORD_EXPRESSION"

# exclude_keywords: # 选择排除的关键词
#   - "Large Language Model"
#   - "LLM"
  
logic: "AND"                 # 组间逻辑：categories 与 keywords 间 AND/OR
max_results: 30
sort_by: "lastUpdatedDate"  # 还可以是submittedDate 建议改成lastUpdatedDate按更新时间排，能捞到v2/v3的“新增”
sort_order: "descending"

# zh / en / both
lang: "both"

# —— 摘要设置 ——
# mode: none / heuristic / llm
summary:
  mode: llm # none / heuristic / llm
  # scope: tldr / full / both
  scope: "both"

# —— 邮件发送（QQ 邮箱） ——
email:
  enabled: true
  subject: "[arXiv] Daily Digest"
  layout_title: ""  # 可选：邮件正文标题；为空时自动使用 site.title
  smtp_server: "smtp.qq.com"
  smtp_port: 465
  smtp_pass_env: "SMTP_PASS"
  tls: "ssl"  # auto / ssl / starttls
  debug: false     # true 可打印 SMTP 调试日志
  detail: "full"  # simple / full
  max_items: 15
  attach_md: true  # 是否开启Markdown附件
  attach_pdf: false  # 是否开启PDF附件

# —— LLM（DeepSeek/OpenAI 兼容） ——
llm:
  provider: "openai-compatible"     # 兼容 OpenAI SDK 的服务
  # 推荐通过 Actions Secrets 注入，避免写死在仓库中
  # 读取优先级：环境变量 > base_url/model 字段
  base_url: ""
  model: ""
  base_url_env: "OPENAI_COMPAT_BASE_URL"
  model_env: "OPENAI_COMPAT_MODEL"
  api_key_env: "OPENAI_COMPAT_API_KEY"
  # DeepSeek 示例（二选一）：
  # base_url_env: "DEEPSEEK_BASE_URL"
  # model_env: "DEEPSEEK_MODEL"
  # api_key_env: "DS_API_KEY"
  

  system_prompt_en: |
    You are a senior paper-reading assistant. Based on the given metadata and abstract,
    write ONE concise paragraph in English that covers: research motivation, main method,
    and key experimental findings. Be objective and specific; avoid marketing language.
    Preserve any provided links, but do NOT repeat them in the paragraph.
  system_prompt_zh: |
    你是资深论文阅读助手。基于给定的论文元信息与摘要，用中文写「一段」简洁的总结，
    包含研究动机、核心方法与关键实验结果。保持客观、术语准确；避免营销式表述。
    如有链接请保留，但不要在总结里重复链接。

  # 提示词配置：从外部文件读取，避免写死在代码里
  prompts:
    domain_context: "Reinforcement learning for AUV/USV navigation, collision avoidance, and multi-agent coordination"
    translate_zh_path: "prompts/translate_zh.yaml"
    deep_analysis_path: "prompts/deep_analysis.yaml"

# —— 中文翻译设置（用 LLM 翻译 title/summary） ——
translate:
  enabled: true         # 是否启用
  lang: "zh"            # 目前只需中文；也可扩展 en/ja 等
  fields: ["title", "summary"]   # 可扩：["title","summary","comments"]
  failure_marker: "【翻译失败】该论文中文摘要暂不可用或者LLM配置错误"

# —— Top-N 深度分析（邮件与网页） ——
analysis:
  enabled: true
  top_n: 10

site:
  enabled: true
  dir: "docs" 
  title: "arXiv and Google scholar论文速递"
  keep_runs: 1024         # 历史保留期（按页面份数）
  theme: "light"        # "light" | "dark" | "auto"
  accent: "#2563eb"     # 主题色（可自定义）

freshness:
  since_days: 3650           # 只看最近 N 天内新提交/更新（1=近24h）
  unique_only: true       # 开启跨天去重（见过的 arXiv ID 不再重复发）
  state_path: ".state/seen.json"  # 去重状态文件（会随 docs 一起提交保存）
  fallback_when_empty: false # 当今天无新增时，是否回退展示最近的Top若干（建议false）

# —— 多来源检索（Arxiv + Scholar） ——
sources:
  enabled: ["arxiv", "scholar"]
  priority: ["arxiv", "scholar"]
  max_candidates: 50

  arxiv:
    max_results: 30
    page_size: 50
    max_pages: 20

  scholar:
    enabled: true
    endpoint: "https://serpapi.com/search.json"
    api_key_env: "SERPAPI_API_KEY"
    max_results: 30
    page_size: 50
    # query 为空时，会自动使用 keywords/categories 组装检索语句
    query: ""
    query_suffix: ""
    timeframe:
      mode: "last_2_years"   # this_year / last_2_years / custom
      start_year: null
      end_year: null

    # Scholar 摘要补全（仅针对摘要过短/疑似截断项）
    abstract_enrichment:
      enabled: true
      min_chars: 260
      max_enrich_items: 20
      timeout: 8
      max_workers: 4
      providers: ["arxiv", "crossref", "openalex", "semantic_scholar", "landing_page"]
      cache_path: ".state/scholar_abstract_cache.json"
      cache_ttl_days: 30
      semantic_scholar_api_key_env: "S2_API_KEY"

# —— Zotero 语义重排（可选） ——
semantic:
  enabled: true
  ranking:
    # 最终排序分数 = time_weight * freshness_score + semantic_weight * semantic_score
    # freshness_score 与 semantic_score 均归一到 0~10
    time_weight: 0.5
    semantic_weight: 0.5
  zotero:
    user_id_env: "ZOTERO_ID"
    api_key_env: "ZOTERO_KEY"
    require_include_path: true
    # 建议指定与你研究方向一致的集合路径，支持 glob（避免全库噪声）
    include_path:
      - "Paper/USV/**"
    max_corpus: 300
  embedding:
    # 推荐通过 Secrets 注入，避免写死在配置中
    base_url: ""
    model: ""
    base_url_env: "SEMANTIC_EMBED_BASE_URL"
    model_env: "SEMANTIC_EMBED_MODEL"
    api_key_env: "SEMANTIC_EMBED_API_KEY"
    batch_size: 64
    timeout: 45

scrape:
  html: true               # 先用 HTML 页抓链接
  pdf_if_missing: true     # 若没抓到 code，再去扫 PDF 头部兜底
  pdf_first_page: false    # （可保留为 false；若你想“不管有没有都扫 PDF”，设 true）
  timeout: 10
